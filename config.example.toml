[network]
# Windows Host sends input to this Linux address.
target = "192.168.1.20:24801"
# Linux Client listens on this address.
bind = "0.0.0.0:24801"

[security]
# Set the same private token on both computers.
token = "replace-with-a-long-random-token"

[performance]
# Merge high-frequency mouse events into a small time window.
mouse_flush_ms = 2
# Restore local control after this many milliseconds without an ACK.
disconnect_timeout_ms = 6000
