[workspace]
members = ["protocol", "config", "topology", "windows", "linux"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.5.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode = "1.3"
